<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignmnet Notes</title>
        <meta charset="UTF-8">
        <style>
            #box{
                height: 75px;
                width: 75px;
                background-color:purple;
                color: white;
                text-align: center;
                /* margin: 0 auto; */
            }
            #grid-wrapper{
                display: grid;
                grid-template-columns: 2fr 1fr 100px;
                gap: 5px;
            }
            button{
                margin-top: 25px;
                padding: 25px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: flex-end;
                align-items: center;
                flex-wrap: wrap;
            }
            img{
                width: 200px;
            }
        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTA8Am5zgrJBY-zfvo6GyFT4OLI3Oob_Yyy_8TLStml_w&s=10" alt="Timp" id="timp" onmouseout="rotate()">
        <div id="grid-wrapper">
            <div id="box" onmouseover="showHide()">
                <p id="text">Show More</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="newColor">
        <br>
        <button onclick="changeColor()">Click Me!</button>

        <script>
            let images = ["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT28LmAeHqI-ZpD7c2AsTJfsXKC9TC10sodAbwNqHpcNA&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3BH9TElvlbtjbcrwRtePQ7av6bQHzllq8W_C4RzmbVkUUJ1B6dYJAykU&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcGuObVn3ow9yvZovFq30Lm1QBakQadCltWbJgHaWB-w&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTA8Am5zgrJBY-zfvo6GyFT4OLI3Oob_Yyy_8TLStml_w&s=10"]
            let currentImage = 0
            function rotate(){
                currentImage += 1
                if (currentImage > 3){
                    currentImage = 0
                }
                document.getElementById("timp").src = images[currentImage]
                
            }
            function changeColor(){
                let currentColor = document.getElementById("newColor").value
                document.getElementById("box").style.backgroundColor = currentColor
            }
            function showHide(){
                let item = document.getElementById("flex-wrapper")
                if(item.style.display == "flex"){
                    item.style.display = "none"
                    document.getElementById("text").innerHTML = "Show More"
                }else{
                    item.style.display = "flex" // block, flex, none, grid 
                    document.getElementById("text").innerHTML = "Show Less"
                }
            }
        </script>
    </body>
</html>
